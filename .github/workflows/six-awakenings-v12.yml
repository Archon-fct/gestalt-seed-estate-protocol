name: Six Awakenings — Isolated Cinematic Study
on:
  push:
    branches: [feature/public-project-constellation]
    paths:
      - 'hud/prototype/experiments/six-awakenings-v12/**'
      - '.github/workflows/six-awakenings-v12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-study:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-dev playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Test real procedural controls and six symbolic chambers
        run: node hud/prototype/experiments/six-awakenings-v12/test-six-awakenings.mjs
      - name: Save actual rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-awakenings-v12-browser-evidence
          path: hud/prototype/test-artifacts/six-awakenings/
          retention-days: 14
          if-no-files-found: ignore
