name: Living Nexus Page Integration
on:
  push:
    branches: [feature/public-project-constellation]
    paths:
      - 'wix/integration/**'
      - 'scripts/build-living-nexus-element.py'
      - 'tests/integration/**'
      - '.github/workflows/living-nexus-page-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: living-nexus-page-integration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXUS_BUILD_DIR: integration-build
      NEXUS_REPORT_DIR: integration-evidence
      NEXUS_ENGINES: chromium,webkit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build from the exact committed source with original renderer locks
        run: |
          mkdir -p integration-evidence
          python scripts/build-living-nexus-element.py --source-sha "$GITHUB_SHA" --output integration-build > integration-evidence/build.json
          node --check integration-build/archon-living-nexus.js
          git archive --format=zip --output=integration-evidence/source-snapshot.zip "$GITHUB_SHA"
      - name: Install pinned verification dependencies
        run: |
          python -m pip install pytest==9.0.2 playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify compiler, Velo routing bridge, browser journeys and isolation
        run: |
          set -o pipefail
          node --test tests/integration/test_wix_bridge.mjs | tee integration-evidence/velo-bridge.log
          python -m pytest tests/integration/test_compiler.py tests/integration/test_element.py -q --tb=short --junitxml=integration-evidence/controlled-browsers.xml | tee integration-evidence/controlled-browsers.log
      - name: Preserve original source directory unchanged
        run: git diff --exit-code -- hud/prototype
      - name: Preserve exact bundle and actual evidence without publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-nexus-integration-${{ github.sha }}
          path: |
            integration-build/
            integration-evidence/
          retention-days: 14
          if-no-files-found: error
