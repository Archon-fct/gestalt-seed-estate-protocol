name: Living Nexus Preview Transfer
on:
  push:
    branches: [feature/public-project-constellation]
    paths: ['.github/workflows/living-nexus-preview-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: living-nexus-preview-transfer
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: 1024f97e787b16eb5d58c551781f2af8601e9330
      MODE: verify
      TARGET_URL: https://headless-mfewrcffiie-archonsoulings-140e.wix-site-host.com/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1024f97e787b16eb5d58c551781f2af8601e9330
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover unchanged deployment and acceptance scripts from pinned revision
        run: |
          mkdir -p deployment-evidence .preview-tools
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          import pathlib,yaml
          source=pathlib.Path('.github/workflows/living-nexus-preview-transfer.yml').read_text()
          config=yaml.safe_load(source)
          names={
              'Package only the approved public runtime':'package.sh',
              'Stage an expiring public-only transfer bundle or select existing preview':'stage.sh',
              'Test deployed resources and browser interactions without changing the source':'smoke.sh'
          }
          for step in config['jobs']['preview']['steps']:
              if step.get('name') in names:
                  pathlib.Path('.preview-tools',names[step['name']]).write_text(step['run'])
          assert all(pathlib.Path('.preview-tools',p).is_file() for p in names.values())
          PY
      - name: Package only the approved public runtime
        run: |
          set -o pipefail
          bash -eo pipefail .preview-tools/package.sh 2>&1 | tee deployment-evidence/package.log
      - name: Install browser test engines
        run: |
          npm init -y > /tmp/preview-npm-init.log
          npm install --save-dev playwright > /tmp/preview-npm-install.log 2>&1 || { tail -80 /tmp/preview-npm-install.log; exit 1; }
          npx playwright install --with-deps chromium webkit > /tmp/preview-browser-install.log 2>&1 || { tail -80 /tmp/preview-browser-install.log; exit 1; }
      - name: Run unchanged release-candidate integration suite
        run: |
          set -o pipefail
          node hud/prototype/test-constellation.mjs 2>&1 | tee deployment-evidence/original-suite.log
      - name: Select the installed isolated preview
        run: |
          set -o pipefail
          bash -eo pipefail .preview-tools/stage.sh 2>&1 | tee deployment-evidence/transfer.log
      - name: Test deployed resources and browser interactions without changing the source
        run: |
          set -o pipefail
          bash -eo pipefail .preview-tools/smoke.sh 2>&1 | tee deployment-evidence/smoke.log
      - name: Inspect every world and physical threshold even after an acceptance failure
        if: always()
        run: |
          cat > inspect-preview.mjs <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {chromium,webkit} from 'playwright';
          const dir='deployment-evidence';
          const base=process.env.TARGET_URL;
          const manifest=JSON.parse(fs.readFileSync(dir+'/bundle-manifest.json'));
          const routes=JSON.parse(fs.readFileSync('hud/prototype/physical-thresholds.json')).routes;
          const results=[];
          async function check(name,fn){try{const detail=await fn();results.push({name,status:'PASS',detail});}catch(e){results.push({name,status:'FAIL',detail:String(e.message).slice(0,1500)});}}
          for(const [name,engine] of [['chromium',chromium],['webkit',webkit]]){
            const browser=await engine.launch({headless:true});
            for(const width of [390,820]){
              const context=await browser.newContext({viewport:{width,height:1180},hasTouch:true,isMobile:true});
              const page=await context.newPage();page.setDefaultTimeout(5000);
              for(const file of manifest.files.filter(x=>x.path.endsWith('.html'))){
                await check(name+' '+width+' '+file.path+' layout and accessible return',async()=>{
                  await page.goto(new URL(file.path,base).href,{waitUntil:'networkidle'});
                  const geometry=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,width:innerWidth,body:document.body.getBoundingClientRect().width}));
                  await page.screenshot({path:dir+'/'+name+'-'+width+'-'+file.path+'.png',fullPage:true});
                  assert.ok(geometry.scroll<=geometry.width,'Horizontal overflow '+JSON.stringify(geometry));
                  if(file.path!=='index.html'){
                    const link=page.locator('a[href="index.html"],a[href="./index.html"]').first();
                    assert.ok(await link.count(),'No explicit Nexus return link');
                    await link.click();
                    await page.waitForURL(url=>url.pathname==='/'||url.pathname==='/index.html');
                  }
                  return geometry;
                });
              }
              for(const [key,route] of Object.entries(routes))await check(name+' '+width+' physical route '+key,async()=>{
                const response=await page.goto(new URL(route.path,base).href,{waitUntil:'networkidle'});
                assert.equal(response.status(),200);
                assert.equal(new URL(page.url()).searchParams.get('threshold'),key);
                assert.equal(await page.locator('h1').count()>0,true);
              });
              await context.close();
            }
            await browser.close();
          }
          const robots=await fetch(new URL('robots.txt',base));
          fs.writeFileSync(dir+'/served-robots.txt',await robots.text());
          const report={url:base,actualIPadSafariTested:false,sourceSha:process.env.SOURCE_SHA,results,passed:results.filter(x=>x.status==='PASS').length,failed:results.filter(x=>x.status==='FAIL').length};
          fs.writeFileSync(dir+'/world-inspection.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report));
          if(report.failed)process.exitCode=1;
          JS
          node inspect-preview.mjs
      - name: Save package and evidence even when an acceptance check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-nexus-preview-evidence
          path: deployment-evidence/
          retention-days: 14
          if-no-files-found: error
