name: Living Nexus Preview Transfer
on:
  push:
    branches: [feature/public-project-constellation]
    paths: ['.github/workflows/living-nexus-preview-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: living-nexus-preview-transfer
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 1024f97e787b16eb5d58c551781f2af8601e9330
      MODE: stage
      TARGET_URL: https://headless-mfewrcffiie-archonsoulings-140e.wix-site-host.com/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1024f97e787b16eb5d58c551781f2af8601e9330
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover unchanged deployment and acceptance scripts from pinned revision
        run: |
          mkdir -p deployment-evidence .preview-tools
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          import pathlib,yaml
          source=pathlib.Path('.github/workflows/living-nexus-preview-transfer.yml').read_text()
          config=yaml.safe_load(source)
          names={
              'Package only the approved public runtime':'package.sh',
              'Stage an expiring public-only transfer bundle or select existing preview':'stage.sh',
              'Test deployed resources and browser interactions without changing the source':'smoke.sh'
          }
          for step in config['jobs']['preview']['steps']:
              if step.get('name') in names:
                  pathlib.Path('.preview-tools',names[step['name']]).write_text(step['run'])
          assert all(pathlib.Path('.preview-tools',p).is_file() for p in names.values())
          PY
      - name: Package only the approved public runtime
        run: bash -eo pipefail .preview-tools/package.sh 2>&1 | tee deployment-evidence/package.log
      - name: Install browser test engines
        run: |
          npm init -y > /tmp/preview-npm-init.log
          npm install --save-dev playwright > /tmp/preview-npm-install.log 2>&1 || { tail -80 /tmp/preview-npm-install.log; exit 1; }
          npx playwright install --with-deps chromium webkit > /tmp/preview-browser-install.log 2>&1 || { tail -80 /tmp/preview-browser-install.log; exit 1; }
      - name: Run unchanged release-candidate integration suite
        run: node hud/prototype/test-constellation.mjs 2>&1 | tee deployment-evidence/original-suite.log
      - name: Stage an expiring public-only transfer bundle or select existing preview
        run: bash -eo pipefail .preview-tools/stage.sh 2>&1 | tee deployment-evidence/transfer.log
      - name: Test deployed resources and browser interactions without changing the source
        run: bash -eo pipefail .preview-tools/smoke.sh 2>&1 | tee deployment-evidence/smoke.log
      - name: Save package and evidence even when an acceptance check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-nexus-preview-evidence
          path: deployment-evidence/
          retention-days: 14
          if-no-files-found: error
