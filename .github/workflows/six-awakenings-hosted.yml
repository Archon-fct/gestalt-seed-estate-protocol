name: Six Awakenings — Hosted Wix Smoke
on:
  push:
    branches: [feature/public-project-constellation]
    paths:
      - '.github/workflows/six-awakenings-hosted.yml'
      - 'hud/prototype/experiments/six-awakenings-v12/test-six-awakenings-hosted.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-dev playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify deployed isolated Six Awakenings
        run: node hud/prototype/experiments/six-awakenings-v12/test-six-awakenings-hosted.mjs
      - name: Capture actual hosted browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-awakenings-hosted-browser-captures
          path: hud/prototype/test-artifacts/six-awakenings-hosted/
          retention-days: 14
          if-no-files-found: ignore
