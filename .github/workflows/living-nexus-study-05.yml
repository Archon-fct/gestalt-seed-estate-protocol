name: Living Nexus Study 05 Visual Evidence
on:
  push:
    branches: [feature/public-project-constellation]
    paths:
      - 'hud/prototype/experiments/*05*'
      - '.github/workflows/living-nexus-study-05.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study05:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm install --save-dev playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Run isolated Study 05 phase and return checks
        run: node hud/prototype/experiments/test-living-constellation-05.mjs
      - name: Preserve unedited actual-browser phase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study05-actual-browser-phase-evidence
          path: hud/prototype/test-artifacts/study05-*.png
          retention-days: 14
          if-no-files-found: warn
