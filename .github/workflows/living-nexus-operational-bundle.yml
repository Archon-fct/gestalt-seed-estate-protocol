name: Living Nexus Operational Bundle
on:
  push:
    branches: [feature/public-project-constellation]
    paths:
      - '.github/workflows/living-nexus-operational-bundle.yml'
      - 'hud/prototype/PREVIEW_BUNDLE_MANIFEST.json'
      - 'scripts/package-living-nexus-release.py'
      - 'tests/test-living-nexus-release-package.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: living-nexus-operational-bundle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact tracked source for reproducible integration
        run: |
          mkdir -p operational-evidence
          git archive --format=zip --output=operational-evidence/source-snapshot.zip "$SOURCE_SHA"
          printf '%s\n' "$SOURCE_SHA" > operational-evidence/SOURCE_SHA.txt
          sha256sum operational-evidence/source-snapshot.zip > operational-evidence/SHA256SUMS.txt
      - name: Capture existing public preview for a reversible update
        run: python3 scripts/package-living-nexus-release.py --capture-preview --output operational-evidence/preview-before.zip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the existing pinned browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Run the unchanged full constellation integration suite
        run: |
          set -o pipefail
          node hud/prototype/test-constellation.mjs 2>&1 | tee operational-evidence/constellation.log
      - name: Recover exact pre-inquiry visual baseline
        if: always()
        run: |
          mkdir -p .convergence-baseline
          for file in convergence.html living-pocket-material.css living-pocket-material.js; do
            git show "7c3703f2ffe8dfe1d15ace82da43333f64ffa28b:hud/prototype/$file" > ".convergence-baseline/$file"
          done
      - name: Run committed inquiry and visual regression suite
        if: always()
        env:
          BASELINE_ROOT: .convergence-baseline
          REPORT_DIR: operational-evidence/convergence-journey
        run: |
          set -o pipefail
          node tests/test-convergence-journey.mjs 2>&1 | tee operational-evidence/convergence.log
      - name: Build complete validated preview with historical routes preserved
        if: success()
        run: |
          python3 tests/test-living-nexus-release-package.py -v
          python3 scripts/package-living-nexus-release.py --preserve-snapshot operational-evidence/preview-before.zip --output operational-evidence/living-nexus-runtime.zip --source-sha "$SOURCE_SHA"
      - name: Preserve source and actual verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-nexus-operational-${{ github.sha }}
          path: operational-evidence/
          retention-days: 14
          if-no-files-found: error
