name: Living Nexus v0.7 — Hosted Cinematic Acceptance
on:
  push:
    branches: [feature/public-project-constellation]
    paths:
      - '.github/workflows/living-nexus-v07-hosted.yml'
      - 'hud/prototype/experiments/test-cinematic-v07-hosted.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for hosted browser tests
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-dev playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify live v0.7 cinematic page and booking
        run: node hud/prototype/experiments/test-cinematic-v07-hosted.mjs
      - name: Save actual hosted browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-nexus-v07-hosted-captures
          path: hud/prototype/test-artifacts/cinematic-v07-live/
          retention-days: 7
          if-no-files-found: ignore
