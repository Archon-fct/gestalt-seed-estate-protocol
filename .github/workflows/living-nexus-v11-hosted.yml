name: Living Nexus Procedural v11 Hosted Smoke
on:
  push:
    branches: [feature/public-project-constellation]
    paths:
      - '.github/workflows/living-nexus-v11-hosted.yml'
      - 'hud/prototype/experiments/test-procedural-v11-hosted.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --save-dev playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Test actual isolated Wix preview
        run: node hud/prototype/experiments/test-procedural-v11-hosted.mjs
      - name: Save unedited served screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-nexus-v11-hosted-captures
          path: hud/prototype/test-artifacts/procedural-v11-hosted/
          retention-days: 7
          if-no-files-found: ignore
