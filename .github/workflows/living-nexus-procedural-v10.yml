name: Living Nexus v0.10 — Hosted Procedural Proof
on:
  push:
    branches: [feature/public-project-constellation]
    paths:
      - '.github/workflows/living-nexus-procedural-v10.yml'
      - 'hud/prototype/experiments/procedural-v10/**'
      - 'hud/prototype/experiments/test-procedural-v10-hosted.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund --save-dev playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Test actual Wix-hosted procedural preview
        run: node hud/prototype/experiments/test-procedural-v10-hosted.mjs
      - name: Preserve hosted screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v10-procedural-hosted-captures
          path: hud/prototype/test-artifacts/procedural-v10/
          retention-days: 7
          if-no-files-found: ignore
