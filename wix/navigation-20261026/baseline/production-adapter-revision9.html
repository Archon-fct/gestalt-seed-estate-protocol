<script>/* Living Nexus production adapter. Public presentation only; native Wix commerce
   and account controls remain owned by Wix. Disable this embed to roll back. */
(() => {
  'use strict';
  if (window.__AS_NEXUS_PRODUCTION_08) return;
  window.__AS_NEXUS_PRODUCTION_08 = true;
  const root = document.documentElement;
  const worlds = new Set(['nexus', 'aura', 'aureglossa', 'sessions', 'workshops', 'gestalt', 'journal', 'threshold']);
  const source = new URL(location.href).searchParams.get('gestaltPreview') === '20261021'
    ? 'https://headless-mfewrcffiie-archonsoulings-140e.wix-site-host.com/living-nexus/gestalt-20261021-1ea41192409f/hosted-nexus.html'
    : 'https://headless-mfewrcffiie-archonsoulings-140e.wix-site-host.com/living-nexus/v08/hosted-nexus.html';
  const frameOrigin = new URL(source).origin;
  let host = null, element = null, timer = 0, watchdog = 0, readinessPoll = 0, ready = false, failed = false;
  const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
  let savedStill = false;
  try { savedStill = localStorage.getItem('as-calm-view') === '1'; } catch {}
  let still = motionQuery.matches || savedStill || root.classList.contains('as-calm'), inViewport = false;
  function updateMotionControl() {
    const control = host?.querySelector('[data-ln-motion]');
    if (!control) return;
    control.setAttribute('aria-pressed', String(still));
    control.textContent = motionQuery.matches ? 'Reduced motion (system)' : 'Reduced motion';
    control.disabled = motionQuery.matches;
  }
  function setMotion(value, remember = false, publish = true) {
    still = motionQuery.matches || value;
    if (root.classList.contains('as-calm') !== still) root.classList.toggle('as-calm', still);
    if (remember) {
      savedStill = value;
      try { localStorage.setItem('as-calm-view', value ? '1' : '0'); } catch {}
    }
    updateMotionControl();
    if (publish) syncState();
  }
  const visibilityObserver = new IntersectionObserver(entries => {
    for (const entry of entries) if (entry.target === element) {
      inViewport = entry.isIntersecting && entry.intersectionRatio > 0;
      syncState();
    }
  });
  const path = () => location.pathname.replace(/\/$/, '') || '/';
  const privateRoute = () => /^\/(?:studio-shell|account|members|my-account|my-bookings|my-orders|login|sign-up)(?:\/|$)/i.test(path()) || /^#(?:vault|private-studio|noxplatinum|nox|veil-ledger|ilyr|archon-admin|gestalt|k3-enroll|k3-login-check)/i.test(location.hash);
  const transactional = () => /(?:^|\/)(?:checkout|cart|bookings-checkout|thank-you)(?:\/|$)/i.test(path());
  const currentWorld = () => {
    const value = new URL(location.href).searchParams.get('world');
    return worlds.has(value) ? value : 'nexus';
  };
  // Retry only the bounded readiness exchange. An iframe load is not proof of readiness.
  function requestReady() {
    if (!element?.isConnected || ready || privateRoute() || transactional() || path() !== '/' || !root.classList.contains('as-public')) return;
    element.contentWindow?.postMessage({ type: 'nexus:host-ready-request' }, frameOrigin);
  }
  function syncState() {
    if (!element?.isConnected || !ready) return;
    element.contentWindow?.postMessage({ type: 'nexus:host-state', world: currentWorld(), still, visible: inViewport && !document.hidden }, frameOrigin);
  }
  function syncWorld() {
    if (!element?.isConnected || !ready) return;
    const world = currentWorld();
    element.contentWindow?.postMessage({ type: 'nexus:host-route', world }, frameOrigin);
    host.dataset.world = world;
  }
  function removeHost() {
    clearTimeout(watchdog); clearInterval(readinessPoll);
    if (element?.isConnected) element.contentWindow?.postMessage({ type: 'nexus:silence' }, frameOrigin);
    if (element) visibilityObserver.unobserve(element);
    if (host?.isConnected) host.remove();
    host = null; element = null; ready = false; inViewport = false;
    if (root.classList.contains('as-nexus-home')) root.classList.remove('as-nexus-home');
  }
  async function reconcile() {
    const enabled = !privateRoute() && !transactional() && root.classList.contains('as-public');
    const currentStill = motionQuery.matches || root.classList.contains('as-calm');
    if (still !== currentStill) { still = currentStill; updateMotionControl(); syncState(); }
    if (root.classList.contains('as-nexus-live') !== enabled) root.classList.toggle('as-nexus-live', enabled);
    if (!enabled || path() !== '/') { removeHost(); failed = false; return; }
    if (failed) return;
    const page = document.getElementById('as-public-page');
    if (!page || page.hidden) return;
    if (privateRoute() || path() !== '/' || !page.isConnected || page.hidden) return;
    if (!host) {
      host = document.createElement('section');
      host.id = 'as-living-nexus-production';
      host.setAttribute('aria-label', 'Living Nexus');
      host.dataset.lnLoading = 'true';
      host.innerHTML = "<div class=\"ln-intro\"><div class=\"ln-intro-copy\"><h1>Living Nexus</h1><p>One-to-one phone sessions with Drew for reflection, guided meditation, and spiritual exploration.</p><p class=\"ln-session-detail\">30 minutes · $100 USD | 60 minutes · $200 USD</p><nav class=\"ln-action-row\" aria-label=\"Session options\"><a class=\"ln-primary\" href=\"/book-online\">Book a session</a><a href=\"mailto:Drew@ArchonSoulings.com\">Ask about a free planning call</a></nav></div><button type=\"button\" class=\"ln-motion-control\" data-ln-motion aria-pressed=\"false\">Reduced motion</button></div><p class=\"ln-loading-note\" role=\"status\">The interactive field is loading. You can explore the links below while it opens.</p><div class=\"ln-environment\"></div><nav class=\"ln-paths\" aria-label=\"Direct paths\"><a href=\"/book-online\">View sessions &amp; availability</a><a href=\"/shop\">Browse the shop</a><a href=\"/?world=gestalt\" data-ln-world=\"gestalt\">Explore Gestalt Seed</a><a href=\"/single-project\">Classes &amp; speaking</a></nav>";
      updateMotionControl();
      host.querySelector('[data-ln-motion]').addEventListener('click', () => setMotion(!still, true));
      element = document.createElement('iframe');
      element.id = 'livingNexusProduction';
      element.title = 'Living Nexus interactive field';
      element.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      element.addEventListener('load', requestReady);
      element.src = source + '?v=20261020-visual12&world=' + encodeURIComponent(currentWorld());
      host.querySelector('.ln-environment').append(element);
      readinessPoll = setInterval(requestReady, 1000);
      watchdog = setTimeout(() => {
        if (ready) return;
        failed = true;
        clearInterval(readinessPoll);
        if (element) { visibilityObserver.unobserve(element); element.remove(); }
        element = null; inViewport = false;
        host.querySelector('.ln-loading-note').textContent = 'The interactive field could not load. You can still use the links below.';
      }, 20000);
      host.addEventListener('click', event => {
        if (!ready) return;
        const link = event.target.closest?.('[data-ln-world]');
        if (!link || event.defaultPrevented || event.button !== 0 || event.ctrlKey || event.metaKey || event.altKey || event.shiftKey) return;
        event.preventDefault();
        const world = link.dataset.lnWorld;
        if (worlds.has(world)) {
          const url = new URL(location.href); url.searchParams.set('world', world);
          if (url.href !== location.href) history.pushState(history.state, '', url);
          syncWorld();
        }
      });
    }
    // Keep the legacy controller's banner -> page -> native adjacency intact.
    // Inserting between banner and page creates a competing observer reorder loop.
    const anchor = document.getElementById('as-public-banner') || page;
    if (!host.isConnected || host.nextElementSibling !== anchor) anchor.before(host);
    visibilityObserver.observe(element);
    if (ready && !root.classList.contains('as-nexus-home')) root.classList.add('as-nexus-home');
    syncWorld();
  }
  window.addEventListener('message', event => {
    if (!element?.isConnected || event.source !== element.contentWindow || event.origin !== frameOrigin || privateRoute() || transactional() || path() !== '/' || !root.classList.contains('as-public')) return;
    const data = event.data;
    if (!data || typeof data !== 'object' || !worlds.has(data.world)) return;
    if (data.type === 'nexus:ready') {
      ready = true; clearTimeout(watchdog); clearInterval(readinessPoll);
      host.dataset.lnLoading = 'false';
      host.querySelector('.ln-loading-note').hidden = true;
      element.contentWindow.postMessage({ type: 'nexus:host-ready-ack', world: currentWorld(), still, visible: inViewport && !document.hidden }, frameOrigin);
      if (!root.classList.contains('as-nexus-home')) root.classList.add('as-nexus-home');
      syncState();
      syncWorld();
    } else if (data.type === 'nexus:motion' && typeof data.still === 'boolean') {
      if (data.still !== still) setMotion(data.still, true, false);
    } else if (data.type === 'nexus:route') {
      const url = new URL(location.href);
      if (data.world === 'nexus') url.searchParams.delete('world'); else url.searchParams.set('world', data.world);
      if (url.href !== location.href) history.pushState(history.state, '', url);
      syncWorld();
    }
  });
  // Coalesce DOM churn without resetting the deadline on every Wix mutation.
  // A trailing debounce can starve mounting while the page is still hydrating.
  const schedule = () => {
    if (timer) return;
    timer = setTimeout(() => { timer = 0; reconcile(); }, 70);
  };
  const start = () => {
    if (still) root.classList.add('as-calm');
    motionQuery.addEventListener('change', () => setMotion(savedStill));
    new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
    new MutationObserver(schedule).observe(root, { attributes: true, attributeFilter: ['class'] });
    window.addEventListener('popstate', schedule);
    window.addEventListener('hashchange', schedule);
    window.addEventListener('pageshow', () => {
      if (!ready && element?.isConnected) { clearInterval(readinessPoll); readinessPoll = setInterval(requestReady, 1000); requestReady(); }
      schedule(); syncState();
    });
    document.addEventListener('visibilitychange', syncState);
    window.addEventListener('pagehide', () => {
      clearTimeout(timer); timer = 0; clearInterval(readinessPoll);
      element?.contentWindow?.postMessage({ type: 'nexus:silence' }, frameOrigin);
      element?.contentWindow?.postMessage({ type: 'nexus:host-state', world: currentWorld(), still, visible: false }, frameOrigin);
    });
    document.addEventListener('click', event => { if (event.target.closest?.('a[href]')) schedule(); });
    reconcile();
  };
  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start, { once: true });
})();
