<script>
(() => {
  'use strict';
  // Public layout requested by the owner; the optional viewport harness remains query-gated.
  if (window.__AS_NAVIGATION_20261026) return;
  window.__AS_NAVIGATION_20261026 = true;
  const root = document.documentElement;
  root.classList.add('as-clear-navigation');
  const links = [['Home','/'],['Sessions','/services'],['Aura Dynamics','/single-project'],['About Drew','/about-3'],['Journal','/blog'],['Shop','/shop']];
  const extra = [['Packages','/pricing-plans/plans-pricing'],['Testimonials','/testimonials'],['Contact Drew','mailto:Drew@ArchonSoulings.com']];
  const nav = (items, label, className) => {
    const el = document.createElement('nav'); el.className = className; el.setAttribute('aria-label',label);
    for (const [name,href] of items) {const a=document.createElement('a'); a.href=href; if(href.startsWith('/')&&new URL(location.href).searchParams.get('navigationReview')==='20261026'){const u=new URL(href,location.origin);u.searchParams.set('navigationReview','20261026');a.href=u.href;} a.textContent=name; el.append(a);}
    return el;
  };
  function refresh() {
    queued = false;
    const header = document.getElementById('as-public-header');
    if (header && !header.querySelector('.as-primary-navigation')) {
      header.querySelector('.as-head-actions')?.before(nav(links,'Main navigation','as-primary-navigation'));
      const button=header.querySelector('[data-as-menu]');
      if(button){button.setAttribute('aria-label','More navigation and comfort settings');button.querySelector('span').textContent='More';}
      const measure=()=>root.style.setProperty('--as-navigation-height',`${Math.ceil(header.getBoundingClientRect().height)}px`);
      new ResizeObserver(measure).observe(header);measure();
    }
    const menu = document.getElementById('as-navigation-dialog');
    if (menu && !menu.querySelector('.as-simple-menu')) {
      // Removing the old orbit lets both existing art controllers clean themselves up.
      menu.querySelector('.as-universe')?.remove();
      const title=menu.querySelector('#as-menu-title'); if(title){title.textContent='Menu';title.after(nav([...links,...extra],'All pages','as-simple-menu'));}
      menu.querySelectorAll('.as-menu-foot a').forEach(a=>a.remove());
    }
    document.querySelectorAll('.as-primary-navigation a,.as-simple-menu a').forEach(a=>{
      const active=a.origin===location.origin && a.pathname===(location.pathname.replace(/\/$/,'')||'/');
      if(active && a.getAttribute('aria-current')!=='page')a.setAttribute('aria-current','page');
      else if(!active && a.hasAttribute('aria-current'))a.removeAttribute('aria-current');
    });
  }
  let queued=false;
  const queue=()=>{if(queued)return;queued=true;requestAnimationFrame(refresh);};
  new MutationObserver(queue).observe(root,{childList:true,subtree:true});
  addEventListener('popstate',queue);addEventListener('hashchange',queue);queue();
})();
</script>
