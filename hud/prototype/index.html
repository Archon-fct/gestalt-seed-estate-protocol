function openNode(btn){last=btn;remember(btn.dataset.id);let d=data[btn.dataset.id];const space=document.querySelector("#space");space.classList.add("crossing");btn.classList.add("resonant");document.querySelector("#space").setAttribute("aria-hidden","true");veil.setAttribute("aria-hidden","false");title.textContent=d.title;copy.textContent=d.copy;acts.innerHTML="";d.actions.forEach(x=>{const url=destinations[btn.dataset.id]?.[x];let a=document.createElement(url?"a":"button");a.textContent=x;if(url){a.href=url;a.className="action";a.rel="noopener"}else{a.onclick=()=>status.textContent=x+" path selected · destination wiring pending review"}acts.appendChild(a)});status.textContent="Crossing into "+d.title;veil.classList.add("preparing");const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches||document.body.classList.contains("still");setTimeout(()=>{veil.classList.remove("preparing");veil.classList.add("open");space.classList.remove("crossing","resonating");btn.classList.remove("resonant");document.querySelector("#back").focus({preventScroll:true})},reduced?0:720)}

});
function closeVeil(){
 const space=document.querySelector("#space"), reduced=matchMedia("(prefers-reduced-motion: reduce)").matches||document.body.classList.contains("still");

threadButton.onclick=()=>journeyPanel.classList.toggle("open");document.querySelector("#continueJourney").onclick=()=>{journeyPanel.classList.remove("open");document.querySelector("#guideChoices").style.display="none"};document.querySelector("#saveJourney").onclick=()=>{if(!journey.length){status.textContent="There is no journey to save yet.";return}sessionStorage.setItem("archonLivingThread",JSON.stringify(journey));status.textContent="Journey saved for this browser session only.";journeyPanel.classList.remove("open")};document.querySelector("#dissolveJourney").onclick=()=>{journey.splice(0);sessionStorage.removeItem("archonLivingThread");document.querySelectorAll(".node.visited").forEach(n=>n.classList.remove("visited"));threadButton.textContent="Living Thread · 0";renderJourney();status.textContent="The journey dissolved.";journeyPanel.classList.remove("open")};try{const saved=JSON.parse(sessionStorage.getItem("archonLivingThread")||"[]");saved.filter(id=>labels[id]).forEach(id=>{if(!journey.includes(id))journey.push(id);document.querySelector('[data-id="'+id+'"]')?.classList.add("visited")});threadButton.textContent="Living Thread · "+journey.length;renderJourney()}catch(e){renderJourney()}
const intentMap={learn:["aura","aureglossa","journal"],experience:["aura","services","workshops"],work:["services","workshops"],create:["workshops","gestalt","aureglossa"],contribute:["gestalt","workshops"]};function applyIntent(intent){const picks=intentMap[intent]||[];document.querySelector("#space").classList.add("guide-active");document.querySelectorAll(".node").forEach(n=>{n.classList.toggle("recommended",picks.includes(n.dataset.id));n.classList.toggle("deemphasized",!picks.includes(n.dataset.id))});document.querySelector("#journeyCopy").textContent="The field is reorganizing around what you explicitly chose. Nothing else is inferred.";journeyPanel.classList.remove("open");status.textContent="Guide Me · "+intent+" · "+picks.map(id=>labels[id]).join(" · ")}document.querySelectorAll("[data-intent]").forEach(b=>b.onclick=()=>applyIntent(b.dataset.intent));
