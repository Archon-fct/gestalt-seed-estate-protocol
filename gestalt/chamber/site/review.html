<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gestalt Chamber · Responsive Review</title><style>body{margin:0;background:#dce2e5;color:#14232b;font:14px/1.5 system-ui}header{padding:14px 20px;background:#f4f5f5;border-bottom:1px solid #a7b1b7}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,a{min-height:44px;padding:10px 14px;box-sizing:border-box;background:white;border:1px solid #667d88;border-radius:4px;color:#14232b;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#173c48;color:white}a{display:inline-flex;align-items:center;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #1478ac;outline-offset:3px}#frame-shell{overflow:auto;padding:16px}iframe{display:block;width:390px;height:1000px;border:0;background:#080d12;max-width:none;margin:0 auto}#result{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 0}</style></head><body><header><nav aria-label="Review widths"><strong>Gestalt · review only</strong><button data-width="390" aria-pressed="true">390 px</button><button data-width="820" aria-pressed="false">820 px</button><button data-width="1280" aria-pressed="false">1280 px</button><button id="measure">Measure layout</button><a href="index.html">Open full experience ↗</a></nav><p id="result" role="status">Frame widths test browser layout, not physical iPhone or iPad Safari.</p></header><div id="frame-shell"><iframe id="candidate" src="index.html" title="Gestalt Seed cinematic candidate"></iframe></div><script>
const frame=document.querySelector('#candidate'),result=document.querySelector('#result');
document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{frame.style.width=b.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));result.textContent='Width set to '+b.dataset.width+' CSS pixels. Measure after layout settles.';}));
document.querySelector('#measure').addEventListener('click',()=>{
 const d=frame.contentDocument,w=frame.contentWindow,visible=[...d.querySelectorAll('button,a,select,summary')].filter(e=>e.getBoundingClientRect().width&&e.getBoundingClientRect().height&&!e.classList.contains('skip'));
 const small=visible.filter(e=>{const r=e.getBoundingClientRect();return r.width<44||r.height<44}).map(e=>e.id||e.textContent.trim());
 const seals=[...d.querySelectorAll('.realm')],overlaps=[];
 for(let i=0;i<seals.length;i++)for(let j=i+1;j<seals.length;j++){const a=seals[i].getBoundingClientRect(),b=seals[j].getBoundingClientRect();if(Math.min(a.right,b.right)>Math.max(a.left,b.left)&&Math.min(a.bottom,b.bottom)>Math.max(a.top,b.top))overlaps.push([seals[i].getAttribute('aria-label'),seals[j].getAttribute('aria-label')]);}
 result.textContent=JSON.stringify({width:w.innerWidth,clientWidth:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,realmCount:seals.length,smallTargets:small.filter(x=>x!=='wixheadless-banner-close'),platformSmallTargets:small.filter(x=>x==='wixheadless-banner-close'),overlappingRealmBounds:overlaps,selected:d.querySelector('#realm-title').textContent,open:d.body.dataset.open,still:d.body.dataset.still,source:'Actual Chromium iframe layout; not physical-device acceptance'},null,2);
});
</script></body></html>
